name: Bug report
description: Report a reproducible problem in Research Facility
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include API keys, contents of `.env` or `.data/`, or private repository details. For a vulnerability, follow SECURITY.md."
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.1.0 or commit SHA"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version and operating system
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use placeholder credentials and repository names.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
